name: Deploy HRM CRM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -xe

            cd /var/www/Hrm-Crm

            git config --global --add safe.directory /var/www/Hrm-Crm || true
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            DOCKER_CMD="docker compose"
            DOCKER_BIN="docker"
            if ! docker ps >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1 && sudo docker ps >/dev/null 2>&1; then
                DOCKER_CMD="sudo docker compose"
                DOCKER_BIN="sudo docker"
              fi
            fi

            $DOCKER_CMD build backend frontend admin
            $DOCKER_CMD up -d --force-recreate backend frontend admin

            # Diagnostics stay in the deploy job log only — never publish to nginx/public HTML.
            sleep 10

            echo "Waiting for backend health check..."

            for i in $(seq 1 15); do
              HEALTH=$($DOCKER_BIN inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                hrm_backend 2>/dev/null || echo "none")
              STATUS=$($DOCKER_BIN inspect --format='{{.State.Status}}' hrm_backend 2>/dev/null || echo "none")

              echo "Attempt $i - Backend health: $HEALTH, status: $STATUS"

              if [ "$HEALTH" = "healthy" ]; then
                echo "Backend is healthy."
                break
              fi

              sleep 5
            done

            echo "=== DOCKER PS ==="
            $DOCKER_CMD ps
            echo "=== BACKEND LOGS (CI only) ==="
            $DOCKER_BIN logs --tail 80 hrm_backend

            FINAL_STATUS=$($DOCKER_BIN inspect --format='{{.State.Status}}' hrm_backend 2>/dev/null || echo "none")
            if [ "$FINAL_STATUS" != "running" ]; then
              echo "Error: hrm_backend container is not running (state: $FINAL_STATUS)"
              exit 1
            fi

            echo "Deployment successful"
