name: Deploy HRM CRM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -xe

            cd /var/www/Hrm-Crm

            git config --global --add safe.directory /var/www/Hrm-Crm || true
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            DOCKER_CMD="docker compose"
            if ! docker compose ps >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1 && sudo docker compose ps >/dev/null 2>&1; then
                DOCKER_CMD="sudo docker compose"
              fi
            fi

            $DOCKER_CMD build backend frontend admin
            $DOCKER_CMD up -d --force-recreate backend frontend admin

            echo "Waiting for backend health check..."

            for i in $(seq 1 12); do
              HEALTH=$($DOCKER_CMD inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                hrm_backend 2>/dev/null || echo "none")

              echo "Attempt $i - Backend health: $HEALTH"

              if [ "$HEALTH" = "healthy" ]; then
                echo "Backend is healthy."
                break
              fi

              if [ "$HEALTH" = "unhealthy" ]; then
                echo "Backend became unhealthy."
                $DOCKER_CMD logs --tail 150 hrm_backend
                exit 1
              fi

              sleep 5
            done

            if [ "$HEALTH" != "healthy" ]; then
              echo "Backend did not become healthy in time."
              $DOCKER_CMD logs --tail 150 hrm_backend
              exit 1
            fi

            echo "Deployment successful"
