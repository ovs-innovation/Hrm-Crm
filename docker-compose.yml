version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: hrm_backend
    restart: always
    ports:
      - "127.0.0.1:3072:5000"
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api
    container_name: hrm_frontend
    restart: always
    ports:
      - "127.0.0.1:3071:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./Admin
      args:
        VITE_API_URL: /api
    container_name: hrm_admin
    restart: always
    ports:
      - "127.0.0.1:3070:80"
    depends_on:
      - backend

  caddy:
    image: caddy:2
    container_name: hrm_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - admin

volumes:
  caddy_data:
  caddy_config:
